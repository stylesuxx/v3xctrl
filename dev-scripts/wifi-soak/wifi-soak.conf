# Sourced by wifi-soak.sh on the Pi. Plain bash assignments.

# Host running the iperf3 servers. The sampler also pings it as a
# connectivity probe.
IPERF_SERVER="192.168.1.100"

# Pi to host stream, against "iperf3 -s -p 5201" on the host.
IPERF_PORT=5201
IPERF_ARGUMENTS="-u -b 5M -l 200"

# Host to Pi stream, against "iperf3 -s -p 5202" on the host. The two
# directions are separate clients so each rate can be set on its own. An
# empty IPERF_REVERSE_ARGUMENTS disables the reverse stream.
IPERF_REVERSE_PORT=5202
IPERF_REVERSE_ARGUMENTS="-u -b 5M -l 200"

# Length of one cycle in seconds. The Pi reboots when it expires.
CYCLE_SECONDS=600

# 1 reboots as soon as the first failure signature shows up in the kernel
# log. 0 keeps the load running to the end of the cycle and records every
# further signature, which shows whether one glitch escalates into a full
# WiFi loss or stays recoverable.
REBOOT_ON_HIT=0

# Seconds after boot to wait for wlan0 to get an address and the server to
# answer ping. Expiry is recorded as result=no-network and the Pi reboots.
NETWORK_TIMEOUT_SECONDS=300

# Run rpicam-vid alongside iperf: 1280x720 at 30 fps, 1.8 Mbit H.264 over UDP
# to IPERF_SERVER:CAMERA_PORT. This is the load that separates pass from fail
# in the reporter's data. Leave at 0 when v3xctrl-video owns the camera.
CAMERA_STREAM=0
CAMERA_PORT=5000

# CPU cores to burn with stress-ng so the SoC reaches the 80 degree capping
# threshold. 0 disables the heat load.
HEAT_LOAD_CPUS=2
